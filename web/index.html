<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070a12">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<title>Raj Trading World — Pro Trading Terminal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #070a12;
  --bg-sidebar: #0b0f1a;
  --card: #111726;
  --card-border: rgba(255, 255, 255, 0.07);
  --card-hover: #172033;
  --card-inner: #090d17;
  --tx: #f1f5f9;
  --tx-dim: #94a3b8;
  --tx-muted: #64748b;
  --buy: #10b981;
  --buy-glow: rgba(16, 185, 129, 0.25);
  --buy-bg: rgba(16, 185, 129, 0.1);
  --sell: #f43f5e;
  --sell-glow: rgba(244, 63, 94, 0.25);
  --sell-bg: rgba(244, 63, 94, 0.1);
  --wait: #f59e0b;
  --wait-glow: rgba(245, 158, 11, 0.2);
  --wait-bg: rgba(245, 158, 11, 0.1);
  --acc: #38bdf8;
  --acc-glow: rgba(56, 189, 248, 0.25);
  --line: rgba(255, 255, 255, 0.08);
  --sidebar-w: 260px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--tx);
  font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
  font-size: 14px;
  line-height: 1.5;
  height: 100vh;
  overflow: hidden;
}

/* App Layout: Left Sidebar + Main Work Area */
.app-container {
  display: flex;
  height: 100vh;
  width: 100vw;
  overflow: hidden;
}

/* Left Sidebar */
aside.sidebar {
  width: var(--sidebar-w);
  background: var(--bg-sidebar);
  border-right: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  z-index: 50;
  transition: transform .25s ease;
}
.sidebar-header {
  padding: 20px 18px 16px;
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.brand-group {
  display: flex;
  align-items: center;
  gap: 12px;
}
.brand-icon {
  width: 38px;
  height: 38px;
  background: linear-gradient(135deg, #38bdf8, #6366f1);
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 800;
  font-size: 18px;
  color: #fff;
  box-shadow: 0 4px 14px var(--acc-glow);
}
.brand-text h1 {
  font-size: 15px;
  font-weight: 800;
  margin: 0;
  letter-spacing: -0.3px;
}
.brand-text span {
  font-size: 11px;
  color: var(--tx-muted);
  display: block;
}
.sidebar-nav {
  padding: 16px 10px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  flex: 1;
  overflow-y: auto;
}
.nav-btn {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 11px 14px;
  background: none;
  border: 1px solid transparent;
  color: var(--tx-dim);
  border-radius: 12px;
  font-size: 13.5px;
  font-weight: 600;
  cursor: pointer;
  text-align: left;
  transition: all .15s ease;
  width: 100%;
}
.nav-btn svg {
  width: 18px;
  height: 18px;
  stroke: currentColor;
  stroke-width: 2;
  fill: none;
  flex-shrink: 0;
}
.nav-btn:hover {
  background: var(--card);
  color: var(--tx);
}
.nav-btn.active {
  background: var(--card-hover);
  color: #fff;
  border-color: rgba(56, 189, 248, 0.35);
  box-shadow: 0 2px 10px rgba(56, 189, 248, 0.15);
}
.nav-btn.active svg {
  stroke: var(--acc);
}
.sidebar-footer {
  padding: 14px 16px;
  border-top: 1px solid var(--line);
  background: rgba(0,0,0,0.2);
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.system-status-pill {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 11.5px;
  color: var(--tx-muted);
}
.status-indicator {
  display: flex;
  align-items: center;
  gap: 6px;
  color: var(--buy);
  font-weight: 600;
}
.pulse-dot {
  width: 7px;
  height: 7px;
  background: var(--buy);
  border-radius: 50%;
  box-shadow: 0 0 8px var(--buy);
}

/* Main Area */
main.main-content {
  flex: 1;
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow: hidden;
  background: var(--bg);
}

/* Top Toolbar */
header.top-toolbar {
  height: 60px;
  border-bottom: 1px solid var(--line);
  padding: 0 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--bg-sidebar);
  flex-shrink: 0;
}
.toolbar-left {
  display: flex;
  align-items: center;
  gap: 16px;
}
.mobile-toggle {
  display: none;
  background: none;
  border: 0;
  color: var(--tx);
  cursor: pointer;
  padding: 6px;
}
.page-title {
  font-size: 16px;
  font-weight: 700;
  letter-spacing: -0.2px;
}
.toolbar-right {
  display: flex;
  align-items: center;
  gap: 12px;
}
.badge {
  font-size: 11px;
  font-weight: 700;
  padding: 4px 10px;
  border-radius: 99px;
  background: var(--card-inner);
  border: 1px solid var(--card-border);
  letter-spacing: 0.3px;
  text-transform: uppercase;
}
.badge.live { color: #10b981; border-color: rgba(16, 185, 129, 0.3); background: rgba(16, 185, 129, 0.1); }
.badge.paper { color: #f59e0b; border-color: rgba(245, 158, 11, 0.3); background: rgba(245, 158, 11, 0.1); }
.btn-action {
  background: var(--card);
  border: 1px solid var(--card-border);
  color: var(--tx-dim);
  border-radius: 10px;
  padding: 7px 14px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 6px;
  transition: all .2s;
}
.btn-action:hover {
  background: var(--card-hover);
  color: #fff;
  border-color: var(--acc);
}

/* Scrollable Viewport */
.scroll-viewport {
  flex: 1;
  overflow-y: auto;
  padding: 20px 24px 60px;
}
.container-max {
  max-width: 1200px;
  margin: 0 auto;
}

/* Cards & Layout */
.card {
  background: var(--card);
  border: 1px solid var(--card-border);
  border-radius: 16px;
  padding: 20px;
  margin-bottom: 16px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.2);
}
.card.highlight-buy {
  border-color: rgba(16, 185, 129, 0.35);
  box-shadow: 0 4px 25px var(--buy-glow);
}
.card.highlight-sell {
  border-color: rgba(244, 63, 94, 0.35);
  box-shadow: 0 4px 25px var(--sell-glow);
}
.card.highlight-wait {
  border-color: rgba(245, 158, 11, 0.35);
  box-shadow: 0 4px 25px var(--wait-glow);
}

/* Signal Hero Component */
.signal-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 16px;
}
.signal-title-area h2 {
  font-size: 26px;
  font-weight: 800;
  margin: 0;
  letter-spacing: -0.5px;
}
.action-tag {
  font-size: 14px;
  font-weight: 800;
  padding: 6px 18px;
  border-radius: 10px;
  letter-spacing: 0.5px;
}
.tag-buy { background: var(--buy); color: #022c22; box-shadow: 0 4px 14px var(--buy-glow); }
.tag-sell { background: var(--sell); color: #fff; box-shadow: 0 4px 14px var(--sell-glow); }
.tag-wait { background: var(--wait); color: #451a03; box-shadow: 0 4px 14px var(--wait-glow); }

.grid-4 {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 12px;
  margin: 16px 0;
}
.metric-tile {
  background: var(--card-inner);
  border: 1px solid var(--card-border);
  border-radius: 12px;
  padding: 12px 16px;
}
.metric-tile.entry { border-color: rgba(56, 189, 248, 0.3); }
.metric-tile.sl { border-color: rgba(244, 63, 94, 0.3); background: var(--sell-bg); }
.metric-tile.t1 { border-color: rgba(16, 185, 129, 0.3); background: var(--buy-bg); }
.metric-tile.t2 { border-color: rgba(16, 185, 129, 0.3); background: var(--buy-bg); }
.tile-lbl {
  font-size: 11.5px;
  font-weight: 700;
  color: var(--tx-muted);
  text-transform: uppercase;
  margin-bottom: 4px;
  display: block;
}
.tile-val {
  font-family: 'JetBrains Mono', monospace;
  font-size: 18px;
  font-weight: 700;
  color: var(--tx);
}
.metric-tile.sl .tile-val { color: var(--sell); }
.metric-tile.t1 .tile-val { color: var(--buy); }
.metric-tile.t2 .tile-val { color: var(--buy); }
.metric-tile.entry .tile-val { color: var(--acc); }

/* Option Hero Box */
.option-banner {
  background: linear-gradient(135deg, rgba(30, 41, 59, 0.7), rgba(15, 23, 42, 0.8));
  border: 1px solid rgba(56, 189, 248, 0.3);
  border-radius: 14px;
  padding: 16px;
  margin: 16px 0;
}
.option-title {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 12px;
  font-weight: 700;
  color: var(--acc);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 8px;
}
.option-details {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  flex-wrap: wrap;
  gap: 12px;
}
.opt-contract {
  font-size: 20px;
  font-weight: 800;
  color: #fff;
}
.opt-price {
  font-family: 'JetBrains Mono', monospace;
  font-size: 24px;
  font-weight: 800;
  color: var(--acc);
}

.copy-btn-large {
  width: 100%;
  background: linear-gradient(135deg, #2563eb, #1d4ed8);
  border: 0;
  border-radius: 12px;
  color: #fff;
  padding: 13px;
  font-weight: 700;
  font-size: 14.5px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  cursor: pointer;
  box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);
  margin-top: 14px;
  transition: transform .1s;
}
.copy-btn-large:active { transform: scale(0.98); }

/* Chart Terminal Styles */
.chart-viewport {
  background: var(--card-inner);
  border: 1px solid var(--card-border);
  border-radius: 16px;
  padding: 16px;
  margin-bottom: 16px;
}
.chart-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
  margin-bottom: 12px;
}
.symbol-selector {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  scrollbar-width: none;
}
.symbol-pill {
  background: var(--card);
  border: 1px solid var(--card-border);
  color: var(--tx-dim);
  padding: 6px 14px;
  border-radius: 8px;
  font-size: 12.5px;
  font-weight: 700;
  cursor: pointer;
  white-space: nowrap;
  transition: all .15s;
}
.symbol-pill:hover, .symbol-pill.active {
  background: var(--card-hover);
  color: #fff;
  border-color: var(--acc);
}
.chart-canvas-container {
  width: 100%;
  height: 400px;
  background: #060911;
  border-radius: 12px;
  position: relative;
}
.chart-canvas-container canvas {
  width: 100%;
  height: 100%;
  display: block;
}

/* Mood strip horizontal */
.mood-bar {
  display: flex;
  gap: 10px;
  overflow-x: auto;
  padding: 4px 0 16px;
  scrollbar-width: none;
}
.mood-box {
  flex: 0 0 auto;
  background: var(--card);
  border: 1px solid var(--card-border);
  border-radius: 12px;
  padding: 10px 14px;
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 13px;
}
.mood-box.BULLISH { border-color: rgba(16, 185, 129, 0.35); color: var(--buy); }
.mood-box.BEARISH { border-color: rgba(244, 63, 94, 0.35); color: var(--sell); }
.mood-box.SIDEWAYS { border-color: rgba(245, 158, 11, 0.35); color: var(--wait); }

/* Toast */
#toast {
  position: fixed;
  right: 24px;
  bottom: 24px;
  z-index: 9999;
  display: none;
  background: #111a2e;
  border: 1px solid var(--acc);
  border-radius: 12px;
  padding: 12px 18px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.6);
  font-size: 13.5px;
}

/* Form Styles */
input, select {
  width: 100%;
  background: var(--card-inner);
  color: var(--tx);
  border: 1px solid var(--card-border);
  border-radius: 12px;
  padding: 12px 14px;
  font-size: 15px;
  font-family: inherit;
  margin-top: 6px;
}
input:focus, select:focus {
  outline: none;
  border-color: var(--acc);
}
button.pri {
  background: linear-gradient(135deg, #38bdf8, #2563eb);
  color: #fff;
  border: 0;
  border-radius: 12px;
  padding: 12px 20px;
  font-weight: 700;
  font-size: 14.5px;
  cursor: pointer;
}

/* Responsive Mobile Rules */
@media (max-width: 860px) {
  aside.sidebar {
    position: fixed;
    left: 0;
    top: 0;
    bottom: 0;
    transform: translateX(-100%);
    box-shadow: 10px 0 30px rgba(0,0,0,0.5);
  }
  aside.sidebar.mobile-open {
    transform: translateX(0);
  }
  .mobile-toggle {
    display: block;
  }
  .chart-canvas-container {
    height: 300px;
  }
  .scroll-viewport {
    padding: 14px 14px 80px;
  }
}
</style>
</head>
<body>

        Trading Settings
      </button>
    </nav>

    <div class="sidebar-footer">
      <div class="system-status-pill">
        <span>Angel SmartAPI:</span>
        <div class="status-indicator">
          <div class="pulse-dot"></div>

  </aside>

  <!-- Main Work Area -->
  <main class="main-content">
    <header class="top-toolbar">
      <div class="toolbar-left">

          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>

    <div class="scroll-viewport" id="viewport">

<div id="toast" role="alert"></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = x => {
  if (x == null) return "-";
  const a = Math.abs(x);
  return a >= 1000 ? Math.round(x).toLocaleString("en-IN") : a >= 10 ? x.toFixed(2) : x.toFixed(4);
};
const hm = iso => iso ? new Date(iso).toLocaleTimeString("en-IN", { hour: "2-digit", minute: "2-digit", hour12: true, timeZone: "Asia/Kolkata" }) : "-";

let currentTab = "signals";
let selectedChartSym = "NIFTY";
let selectedChartTF = "5m";

function key() { try { return localStorage.getItem("rtw_key") || ""; } catch(e) { return ""; } }
async function api(path, opt = {}) {
  const sep = path.includes("?") ? "&" : "?";
  const r = await fetch(path + (key() ? sep + "key=" + encodeURIComponent(key()) : ""), opt);
  if (r.status === 401) {
    const k = prompt("Password / Access key daalo");
    if (k) { try { localStorage.setItem("rtw_key", k); } catch(e){} return api(path, opt); }
    throw new Error("Access key chahiye");
  }
  if (!r.ok) {
    let m = r.statusText;
    try { m = (await r.json()).detail || m; } catch(e){}
    throw new Error(m);
  }
  return r.json();
}

function showToast(title, body) {
  const e = $("#toast");
  e.innerHTML = `<b style="display:block;margin-bottom:2px">${esc(title)}</b><span style="color:var(--tx-dim)">${esc(body || "")}</span>`;
  e.style.display = "block";
  setTimeout(() => e.style.display = "none", 7000);
  e.onclick = () => e.style.display = "none";
}

function copyTrade(txt) {
  navigator.clipboard.writeText(txt).then(() => {
    showToast("✅ Signal Copied!", "Aap ab ise broker ya WhatsApp par paste kar sakte hain.");
  }).catch(() => {
    alert("Copied:\n" + txt);
  });
}

// Clock IST
setInterval(() => {
  $("#clockIST").textContent = new Date().toLocaleTimeString("en-IN", { hour: "2-digit", minute: "2-digit", second: "2-digit", timeZone: "Asia/Kolkata" });
}, 1000);

// Canvas Candlestick Chart Renderer
function drawChart(cv, d) {
  const dpr = window.devicePixelRatio || 1, W = cv.clientWidth, H = cv.clientHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  const g = cv.getContext("2d"); g.scale(dpr, dpr); g.clearRect(0, 0, W, H);
  const cs = d.candles || [];
  if (!cs.length) {
    g.fillStyle = "#8f9bb8"; g.font = "14px 'Plus Jakarta Sans'"; g.fillText("Market closed ya data loading...", 20, 30);
    return;
  }
  const PR = 65, PB = 24, pw = W - PR, ph = H - PB;
  let lo = Math.min(...cs.map(c => c.l)), hi = Math.max(...cs.map(c => c.h));
  (d.levels || []).forEach(l => { lo = Math.min(lo, l.price); hi = Math.max(hi, l.price); });
  const pad = (hi - lo) * 0.08 || 1; lo -= pad; hi += pad;
  const y = p => ph - (p - lo) / (hi - lo) * ph, step = pw / cs.length, bw = Math.max(1, step * 0.65);

  g.font = "11px 'JetBrains Mono'"; g.lineWidth = 1;
  for (let i = 0; i <= 5; i++) {
    const p = lo + (hi - lo) * i / 5, yy = y(p);
    g.strokeStyle = "rgba(255,255,255,0.05)"; g.beginPath(); g.moveTo(0, yy); g.lineTo(pw, yy); g.stroke();
    g.fillStyle = "#64748b"; g.fillText(fmt(p), pw + 6, yy + 4);
  }

  cs.forEach((c, i) => {
    const x = i * step + step / 2, up = c.c >= c.o;
    g.strokeStyle = g.fillStyle = up ? "#10b981" : "#f43f5e";
    g.beginPath(); g.moveTo(x, y(c.h)); g.lineTo(x, y(c.l)); g.stroke();
    const t = y(Math.max(c.o, c.c)), b = y(Math.min(c.o, c.c));
    g.fillRect(x - bw / 2, t, bw, Math.max(1, b - t));
  });

  if (d.ema20) {
    g.strokeStyle = "#38bdf8"; g.lineWidth = 1.5; g.beginPath(); let st = false;
    d.ema20.forEach((e, i) => {
      if (e == null) return;
      const x = i * step + step / 2;
      if (!st) { g.moveTo(x, y(e)); st = true; } else g.lineTo(x, y(e));
    });
    g.stroke(); g.lineWidth = 1;
  }

  const sr = d.sr || {};
  (sr.zones || []).forEach(z => {
    const y1 = Math.max(0, Math.min(ph, y(z.hi))), y2 = Math.max(0, Math.min(ph, y(z.lo)));
    if (y2 - y1 < 1) return;
    g.fillStyle = z.kind === "demand" ? "rgba(16, 185, 129, 0.16)" : "rgba(244, 63, 94, 0.16)";
    g.fillRect(0, y1, pw, y2 - y1);
  });

  const col = { entry: "#38bdf8", sl: "#f43f5e", target: "#10b981" };
  let lastLab = -99;
  [...(d.levels || [])].sort((a, b) => y(a.price) - y(b.price)).forEach(l => {
    const yy = y(l.price);
    g.strokeStyle = col[l.kind] || "#f59e0b"; g.setLineDash([5, 4]);
    g.beginPath(); g.moveTo(0, yy); g.lineTo(pw, yy); g.stroke(); g.setLineDash([]);
    const ly = Math.max(yy - 3, lastLab + 12); lastLab = ly;
    g.fillStyle = col[l.kind] || "#f59e0b"; g.fillText((l.label ? l.label + " " : "") + fmt(l.price), 6, ly);
  });

  const last = cs[cs.length - 1];
  g.fillStyle = "#fff"; g.font = "bold 11px 'JetBrains Mono'";
  g.fillText(fmt(last.c), pw + 6, y(last.c) + 4);
}

async function renderSignals() {

function renderSignalCard(t) {
  const isBuy = t.direction === "BUY";
  const o = t.option;
  const copyTxt = `🎯 RTW VIP TRADE CALL:\nSymbol: ${t.label} ${t.action}\nEntry Zone: ${fmt(t.entry_lo)} - ${fmt(t.entry_hi)}\nStoploss (SL): ${fmt(t.sl)}\nTarget 1: ${fmt(t.t1)}\nTarget 2: ${fmt(t.t2)}${o ? `\nRecommended Option: ${t.symbol} ${o.strike} ${o.cp} @ ₹${fmt(o.premium)}\nOption SL: ₹${fmt(o.sl_premium)} | Option T1: ₹${fmt(o.t1_premium)}` : ''}\nHold Till: ${hm(t.exit_by)}`;

  return `
    <div class="card ${isBuy ? 'highlight-buy' : 'highlight-sell'}">
      <div class="signal-header">
        <div class="signal-title-area">
          <div style="font-size:12px;color:var(--tx-muted);font-weight:700;text-transform:uppercase;margin-bottom:4px">
            Grade ${esc(t.grade)} · Confidence ${t.confidence}%
          </div>
          <h2>${esc(t.label)}</h2>
          <div style="font-size:13.5px;color:var(--tx-dim);margin-top:4px">
            <span style="color:${isBuy ? 'var(--buy)' : 'var(--sell)'}">●</span> ${esc(t.status_text)}
          </div>
        </div>
        <div class="action-tag ${isBuy ? 'tag-buy' : 'tag-sell'}">
          ${isBuy ? '▲ BUY CALL' : '▼ SELL PUT'}
        </div>
      </div>

      ${o ? `
        <div class="option-banner">
          <div class="option-title">
            <span>🎯 RECOMMENDED OPTION STRIKE (DIRECT BROKER ORDER)</span>
            <span>Expiry: ${esc(o.expiry)}</span>
          </div>
          <div class="option-details">
            <div class="opt-contract">${esc(t.symbol)} ${esc(o.strike)} ${esc(o.cp)}</div>
            <div>
              <span style="font-size:12px;color:var(--tx-muted)">Approx Premium: </span>
              <span class="opt-price">₹${fmt(o.premium)}</span>
            </div>
          </div>
          <div style="display:flex;gap:16px;margin-top:10px;font-size:13px;border-top:1px solid rgba(255,255,255,0.08);padding-top:8px">
            <div>Premium SL: <b style="color:var(--sell)">₹${fmt(o.sl_premium)}</b></div>
            <div>Premium T1: <b style="color:var(--buy)">₹${fmt(o.t1_premium)}</b></div>
          </div>
        </div>
      ` : ''}

      <div class="grid-4">
        <div class="metric-tile entry">
          <span class="tile-lbl">Entry Zone</span>
          <span class="tile-val">${fmt(t.entry_lo)} – ${fmt(t.entry_hi)}</span>
        </div>
        <div class="metric-tile sl">
          <span class="tile-lbl">Stoploss (SL)</span>
          <span class="tile-val">${fmt(t.sl)}</span>
        </div>
        <div class="metric-tile t1">
          <span class="tile-lbl">Target 1 (T1)</span>
          <span class="tile-val">${fmt(t.t1)}</span>
        </div>
        <div class="metric-tile t2">
          <span class="tile-lbl">Target 2 (T2)</span>
          <span class="tile-val">${fmt(t.t2)}</span>
        </div>
      </div>

      <div style="display:flex;justify-content:space-between;background:var(--card-inner);padding:10px 16px;border-radius:12px;font-size:13px;color:var(--tx-dim);margin:12px 0">
        <div>Valid Till: <b>${hm(t.valid_till)}</b></div>
        <div>Exit By: <b>${hm(t.exit_by)}</b></div>
        <div>Risk-Reward: <b>${t.rr ? '1:' + t.rr.toFixed(1) : '-'}</b></div>
      </div>

      <button class="copy-btn-large" data-copy="${esc(copyTxt)}">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        Copy Signal for Broker / WhatsApp
      </button>

      <div style="margin-top:16px;padding-top:12px;border-top:1px solid var(--line);font-size:13px;color:var(--tx-dim)">
        <b style="color:var(--tx)">Kyu buy karein (Technical Reasons):</b>
        <div style="margin-top:6px">${(t.reasons || []).map(r => `<div>• ${esc(r)}</div>`).join("")}</div>
      </div>
    </div>
  `;
}

          <span id="chartLTP" style="font-family:'JetBrains Mono';font-size:18px;margin-left:8px;font-weight:700;color:var(--tx)">-</span>

      $("#tvLink").href = d.tv_url || `https://www.tradingview.com/chart/?symbol=${selectedChartSym}`;
      const cs = d.candles || [];
      if (cs.length) {
        $("#chartLTP").textContent = "₹" + fmt(cs[cs.length - 1].c);
      }
      const sr = d.sr || {};
      const sArr = (sr.supports || []).slice(0, 1).map(x => "S: ₹" + fmt(x.price));
      const rArr = (sr.resistances || []).slice(0, 1).map(x => "R: ₹" + fmt(x.price));
      $("#srText").textContent = [...sArr, ...rArr].join(" · ");

      drawChart($("#mainChartCanvas"), d);

      // Render Technical Insights
      $("#techDetails").innerHTML = `
        <div style="display:grid;grid-template-columns:repeat(auto-fit, minmax(200px, 1fr));gap:12px">

          <div><b>Support Levels:</b> ${sr.supports ? sr.supports.map(s => '₹' + fmt(s.price)).join(", ") : '-'}</div>
          <div><b>Resistance Levels:</b> ${sr.resistances ? sr.resistances.map(r => '₹' + fmt(r.price)).join(", ") : '-'}</div>
        </div>
      `;
    } else {
      $("#techDetails").textContent = d.message || "Data available nahi hai.";
    }
  } catch(e) {
    $("#techDetails").textContent = "Error loading chart: " + e.message;
  }
}

          <p style="color:var(--tx-dim);font-size:14px">${esc(d.note || "")}</p>

              <div class="metric-tile sl"><span class="tile-lbl">SL</span><span class="tile-val">${fmt(d.plan.sl)}</span></div>
              <div class="metric-tile t1"><span class="tile-lbl">T1</span><span class="tile-val">${fmt(d.plan.t1)}</span></div>
              <div class="metric-tile t2"><span class="tile-lbl">T2</span><span class="tile-val">${fmt(d.plan.t2)}</span></div>
            </div>
          ` : `<p style="color:var(--tx-muted)">${esc(d.wait_reason || "Koi trade trigger nahi hua hai.")}</p>`}

          <button class="pri" id="btnOpenInCharts" style="margin-top:14px">📈 View Interactive Candlestick Chart</button>
        </div>
      `;
      $("#btnOpenInCharts").onclick = () => {
        selectedChartSym = r.symbol;
        switchTab("charts");
      };
    } catch(e) {
      $("#searchResult").innerHTML = `<div class="card" style="color:var(--sell)">Error: ${e.message}</div>`;
    }
  };

  $("#btnSearchGo").onclick = doSearch;
  $("#searchQuery").onkeydown = e => { if (e.key === "Enter") doSearch(); };
}

// ---------------- TAB 5: NEWS & CALENDAR ----------------
async function renderNews() {
  $("#pageTitle").textContent = "News Intelligence & Event Calendar";
  const d = await api("/api/news");
  $("#contentArea").innerHTML = `
    <div class="card">
      <div style="font-size:12px;font-weight:700;color:var(--tx-muted);text-transform:uppercase;margin-bottom:6px">Global News Mode</div>
      <div style="display:flex;align-items:center;gap:12px">
        <span class="action-tag ${d.mode === 'CALM' ? 'tag-buy' : 'tag-wait'}" style="font-size:12px">${esc(d.mode)}</span>
        <span style="font-size:14px;color:var(--tx-dim)">${d.mode === 'CALM' ? 'Markets are calm. Technical analysis is fully reliable.' : 'High event volatility detected.'}</span>
      </div>
      ${d.reason ? `<p style="margin:10px 0 0;color:var(--tx-muted)">${esc(d.reason)}</p>` : ''}
    </div>

    <div class="card">
      <h3 style="font-size:15px;margin:0 0 12px">High Impact Events (Economic Calendar)</h3>
      ${(d.events || []).map(e => `
        <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)">
          <div>
            <b>${esc(e.name)}</b>
            <div style="font-size:11.5px;color:var(--tx-muted)">Impacts: ${(e.assets || []).join(", ")}</div>
          </div>
          <span style="font-weight:700;color:${e.impact === 'HIGH' ? 'var(--sell)' : 'var(--tx-dim)'}">${esc(e.when_text)}</span>
        </div>
      `).join("") || '<p style="color:var(--tx-muted)">Koi upcoming event nahi hai.</p>'}
    </div>

    <div class="card">
      <h3 style="font-size:15px;margin:0 0 12px">Live Tagged Headlines</h3>
      ${(d.headlines || []).map(x => `
        <div style="padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px">
          ${esc(x.title)}
        </div>
      `).join("") || '<p style="color:var(--tx-muted)">Headlines loading...</p>'}
    </div>
  `;
}

// ---------------- TAB 6: PERFORMANCE JOURNAL ----------------
async function renderRecord() {
  $("#pageTitle").textContent = "Trading Record & P&L Log";
  const d = await api("/api/record"), a = d.all;
  let pts = "";
  if (d.equity.length > 1) {
    const ys = d.equity.map(e => e.cum_r), mn = Math.min(0, ...ys), mx = Math.max(0.1, ...ys);
    pts = d.equity.map((e, i) => `${(i / (d.equity.length - 1)) * 300},${88 - ((e.cum_r - mn) / (mx - mn)) * 80}`).join(" ");
  }

  $("#contentArea").innerHTML = `
    <div class="card">
      <h3 style="font-size:15px;margin:0 0 12px">Performance Metrics</h3>
      <div class="grid-4">
        <div class="metric-tile"><span class="tile-lbl">Total Trades</span><span class="tile-val">${a.trades}</span></div>
        <div class="metric-tile t1"><span class="tile-lbl">Win Rate</span><span class="tile-val">${(a.win_rate * 100).toFixed(0)}%</span></div>
        <div class="metric-tile entry"><span class="tile-lbl">Total P&L</span><span class="tile-val">${a.total_r.toFixed(2)}R</span></div>
        <div class="metric-tile"><span class="tile-lbl">Avg Trade</span><span class="tile-val">${a.avg_r.toFixed(2)}R</span></div>
      </div>
      ${pts ? `<svg viewBox="0 0 300 90" preserveAspectRatio="none" style="width:100%;height:100px;margin-top:14px"><polyline fill="none" stroke="#38bdf8" stroke-width="2.5" points="${pts}"/></svg>` : '<p style="color:var(--tx-muted);font-size:13px;margin:10px 0 0">Equity curve minimum 2 closed trades ke baad dikhega.</p>'}
    </div>

    <div class="card">
      <h3 style="font-size:15px;margin:0 0 12px">Past Closed Trades</h3>
      ${d.last.map(l => `
        <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)">
          <div>
            <b>${esc(l.symbol)}</b>
            <span class="badge ${l.direction === 'BUY' ? 'live' : 'paper'}" style="margin-left:6px">${esc(l.direction)}</span>
          </div>
          <span style="font-family:'JetBrains Mono';font-weight:700;color:${(l.r || 0) >= 0 ? 'var(--buy)' : 'var(--sell)'}">
            ${l.r != null ? (l.r > 0 ? '+' : '') + l.r.toFixed(2) + 'R' : esc(l.state)}
          </span>
        </div>
      `).join("") || '<p style="color:var(--tx-muted)">Abhi koi closed trade nahi hai.</p>'}
    </div>
  `;
}

// ---------------- TAB 7: SETTINGS ----------------
async function renderSettings() {
  $("#pageTitle").textContent = "Capital & Risk Settings";
  const s = await api("/api/settings");
  $("#contentArea").innerHTML = `
    <div class="card">
      <h3 style="margin:0 0 16px;font-size:16px">Trading Rules & Profile</h3>

      <div style="margin-bottom:14px">
        <label style="font-size:12.5px;color:var(--tx-muted);font-weight:700">Account Trading Capital (₹)</label>
        <input id="cap" type="number" value="${s.capital}">
      </div>

      <div style="margin-bottom:14px">
        <label style="font-size:12.5px;color:var(--tx-muted);font-weight:700">Risk Per Trade (%)</label>
        <input id="rp" type="number" step="0.1" value="${(s.risk_pct * 100).toFixed(1)}">
      </div>

      <div style="margin-bottom:14px">
        <label style="font-size:12.5px;color:var(--tx-muted);font-weight:700">Ek Saath Kitne Active Signals Chahiye? (1 = Strict Single Call)</label>
        <select id="mt">
          ${[1, 2, 3, 4, 5].map(n => `<option ${n === s.max_trades ? "selected" : ""}>${n}</option>`).join("")}
        </select>
      </div>

      <div style="margin-bottom:20px">
        <label style="font-size:12.5px;color:var(--tx-muted);font-weight:700">AI Risk Filter Profile</label>
        <select id="pf">
          ${["conservative", "moderate", "aggressive"].map(p => `<option ${p === s.profile ? "selected" : ""}>${p}</option>`).join("")}
        </select>
      </div>

      <button class="pri" id="btnSaveSettings">Save New Settings</button>
      <div id="saveMsg" style="margin-top:12px;font-weight:600;text-align:center"></div>
    </div>
  `;

  $("#btnSaveSettings").onclick = async () => {
    try {
      await api("/api/settings", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({
          capital: +$("#cap").value,
          risk_pct: +$("#rp").value / 100,
          profile: $("#pf").value,
          max_trades: +$("#mt").value
        })
      });
      $("#saveMsg").style.color = "var(--buy)";
      $("#saveMsg").textContent = "✅ Settings successfully save ho gayi!";
      setTimeout(() => $("#saveMsg").textContent = "", 3000);
    } catch(e) {
      $("#saveMsg").style.color = "var(--sell)";
      $("#saveMsg").textContent = "❌ " + e.message;
    }
  };
}

// ---------------- Navigation Router ----------------
const tabViews = {
  signals: renderSignals,
  charts: renderCharts,
  markets: renderMarkets,
  search: renderSearch,
  news: renderNews,
  record: renderRecord,
  settings: renderSettings
};

function switchTab(t) {
  currentTab = t;
  document.querySelectorAll(".nav-btn").forEach(b => b.classList.toggle("active", b.dataset.t === t));
  $("#sidebar").classList.remove("mobile-open");
  $("#contentArea").innerHTML = `<div style="color:var(--tx-muted);padding:20px">Loading...</div>`;
  tabViews[t]().catch(err => {
    $("#contentArea").innerHTML = `<div class="card" style="color:var(--sell)">Error: ${esc(err.message)}</div>`;
  });
}

document.querySelectorAll(".nav-btn").forEach(b => {
  b.onclick = () => switchTab(b.dataset.t);
});

$("#btnToggleSidebar").onclick = () => {
  $("#sidebar").classList.toggle("mobile-open");
};

$("#btnRefresh").onclick = () => {
  switchTab(currentTab);
  showToast("Refreshing...", "Taza market data reload ho raha hai");
};

document.addEventListener("click", e => {
  const c = e.target.closest("[data-copy]");
  if (c) copyTrade(c.dataset.copy);
});

// Auto-refresh interval (every 30s)
setInterval(() => {
  if (document.visibilityState === "visible") {
    if (currentTab === "signals") renderSignals();
  }
}, 30000);

// Init
switchTab("signals");
if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});
</script>
</body>
</html>
