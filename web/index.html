<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070a13">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<title>Raj Trading World — Pro Signals</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #070a13;
  --bg-gradient: radial-gradient(circle at 50% 0%, #151d33 0%, #070a13 75%);
  --card: rgba(18, 25, 43, 0.75);
  --card-border: rgba(255, 255, 255, 0.08);
  --card-hover: rgba(25, 36, 62, 0.85);
  --card-inner: rgba(10, 15, 28, 0.65);
  --tx: #f1f5f9;
  --tx-dim: #94a3b8;
  --tx-muted: #64748b;
  --buy: #10b981;
  --buy-glow: rgba(16, 185, 129, 0.25);
  --buy-bg: rgba(16, 185, 129, 0.12);
  --sell: #f43f5e;
  --sell-glow: rgba(244, 63, 94, 0.25);
  --sell-bg: rgba(244, 63, 94, 0.12);
  --wait: #f59e0b;
  --wait-glow: rgba(245, 158, 11, 0.2);
  --wait-bg: rgba(245, 158, 11, 0.1);
  --acc: #38bdf8;
  --acc-glow: rgba(56, 189, 248, 0.25);
  --line: rgba(255, 255, 255, 0.08);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0;
  background: var(--bg);
  background-image: var(--bg-gradient);
  background-attachment: fixed;
  color: var(--tx);
  font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
  font-size: 14.5px;
  line-height: 1.5;
  min-height: 100vh;
}
body {
  padding: 0 16px calc(88px + env(safe-area-inset-bottom));
  max-width: 580px;
  margin: 0 auto;
}
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 0 12px;
  border-bottom: 1px solid var(--line);
  margin-bottom: 14px;
}
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
}
.brand-logo {
  width: 36px;
  height: 36px;
  background: linear-gradient(135deg, #38bdf8, #6366f1);
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 800;
  font-size: 16px;
  color: #fff;
  box-shadow: 0 4px 14px rgba(56, 189, 248, 0.35);
}
.brand-info h1 {
  font-size: 16px;
  font-weight: 700;
  margin: 0;
  letter-spacing: -0.2px;
}
.brand-info span {
  font-size: 11px;
  color: var(--tx-muted);
  display: block;
}
.header-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}
.badge {
  font-size: 11px;
  font-weight: 600;
  padding: 3px 10px;
  border-radius: 99px;
  background: var(--card-inner);
  color: var(--tx-dim);
  border: 1px solid var(--card-border);
  letter-spacing: 0.3px;
  text-transform: uppercase;
}
.badge.live { color: #10b981; border-color: rgba(16, 185, 129, 0.3); background: rgba(16, 185, 129, 0.1); }
.badge.paper { color: #f59e0b; border-color: rgba(245, 158, 11, 0.3); background: rgba(245, 158, 11, 0.1); }
.btn-refresh {
  background: var(--card);
  border: 1px solid var(--line);
  color: var(--tx-dim);
  border-radius: 99px;
  width: 32px;
  height: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all .2s;
}
.btn-refresh:active { transform: rotate(180deg); color: var(--acc); }

/* Cards & Glassmorphism */
.card {
  background: var(--card);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border: 1px solid var(--card-border);
  border-radius: 18px;
  padding: 16px;
  margin: 12px 0;
  box-shadow: 0 8px 24px rgba(0,0,0,0.25);
  transition: border-color .2s;
}
.card.highlight-buy {
  border-color: rgba(16, 185, 129, 0.4);
  box-shadow: 0 8px 30px var(--buy-glow);
}
.card.highlight-sell {
  border-color: rgba(244, 63, 94, 0.4);
  box-shadow: 0 8px 30px var(--sell-glow);
}
.card.highlight-wait {
  border-color: rgba(245, 158, 11, 0.35);
  box-shadow: 0 8px 30px var(--wait-glow);
}

/* Call Banners */
.signal-hero {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 12px;
}
.signal-title {
  font-size: 22px;
  font-weight: 800;
  letter-spacing: -0.5px;
  margin: 0;
  display: flex;
  align-items: center;
  gap: 8px;
}
.action-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 13px;
  font-weight: 800;
  padding: 5px 14px;
  border-radius: 10px;
  letter-spacing: 0.5px;
}
.pill-buy { background: var(--buy); color: #022c22; box-shadow: 0 4px 14px var(--buy-glow); }
.pill-sell { background: var(--sell); color: #fff; box-shadow: 0 4px 14px var(--sell-glow); }
.pill-wait { background: var(--wait); color: #451a03; box-shadow: 0 4px 14px var(--wait-glow); }

.status-subtitle {
  font-size: 13.5px;
  color: var(--tx-dim);
  margin: 4px 0 12px;
  display: flex;
  align-items: center;
  gap: 6px;
}

/* Grids for Metrics */
.metrics-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin: 12px 0;
}
.metric-box {
  background: var(--card-inner);
  border: 1px solid var(--card-border);
  border-radius: 14px;
  padding: 10px 12px;
}
.metric-box.danger { border-color: rgba(244, 63, 94, 0.3); background: var(--sell-bg); }
.metric-box.success { border-color: rgba(16, 185, 129, 0.3); background: var(--buy-bg); }
.metric-box.accent { border-color: rgba(56, 189, 248, 0.3); }
.metric-label {
  font-size: 11.5px;
  font-weight: 600;
  color: var(--tx-muted);
  text-transform: uppercase;
  letter-spacing: 0.4px;
  display: block;
  margin-bottom: 2px;
}
.metric-val {
  font-family: 'JetBrains Mono', monospace;
  font-size: 16px;
  font-weight: 700;
  color: var(--tx);
}
.metric-box.danger .metric-val { color: var(--sell); }
.metric-box.success .metric-val { color: var(--buy); }
.metric-box.accent .metric-val { color: var(--acc); }

/* Option Box */
.option-highlight {
  background: linear-gradient(135deg, rgba(30, 41, 59, 0.8), rgba(15, 23, 42, 0.9));
  border: 1px solid rgba(56, 189, 248, 0.35);
  border-radius: 14px;
  padding: 12px;
  margin: 12px 0;
}
.opt-tag {
  font-size: 11px;
  font-weight: 700;
  color: var(--acc);
  text-transform: uppercase;
  margin-bottom: 4px;
  display: flex;
  justify-content: space-between;
}

/* Copy Tip Bar */
.btn-copy-call {
  width: 100%;
  background: linear-gradient(135deg, #2563eb, #1d4ed8);
  border: 0;
  border-radius: 12px;
  color: #fff;
  padding: 11px 16px;
  font-weight: 700;
  font-size: 13.5px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  cursor: pointer;
  margin-top: 10px;
  box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);
  transition: transform .15s;
}
.btn-copy-call:active { transform: scale(0.98); }

/* Mood Bar */
.mood-strip-card {
  padding: 12px 14px;
}
.mood-header {
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  color: var(--tx-muted);
  letter-spacing: 0.5px;
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.mood-scroll {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding-bottom: 4px;
  scrollbar-width: none;
}
.mood-scroll::-webkit-scrollbar { display: none; }
.mood-pill {
  flex: 0 0 auto;
  background: var(--card-inner);
  border: 1px solid var(--card-border);
  border-radius: 12px;
  padding: 6px 12px;
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12.5px;
}
.mood-pill b { font-weight: 700; }
.mood-pill.BULLISH { border-color: rgba(16, 185, 129, 0.3); color: var(--buy); }
.mood-pill.BEARISH { border-color: rgba(244, 63, 94, 0.3); color: var(--sell); }
.mood-pill.SIDEWAYS { border-color: rgba(245, 158, 11, 0.3); color: var(--wait); }

/* Chips & Filters */
.chips {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 6px 0 12px;
  scrollbar-width: none;
}
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: 0 0 auto;
  white-space: nowrap;
  border: 1px solid var(--line);
  background: var(--card);
  color: var(--tx-dim);
  border-radius: 99px;
  padding: 7px 16px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all .2s;
}
.chip.on {
  color: #fff;
  background: var(--card-hover);
  border-color: var(--acc);
  box-shadow: 0 2px 10px var(--acc-glow);
}

/* Bottom Nav */
nav {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  display: flex;
  background: rgba(10, 15, 28, 0.92);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom);
  z-index: 100;
  max-width: 580px;
  margin: 0 auto;
}
nav button {
  flex: 1;
  background: none;
  border: 0;
  color: var(--tx-muted);
  padding: 10px 4px 8px;
  font-size: 11px;
  font-weight: 600;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  cursor: pointer;
  transition: all .2s;
}
nav button svg {
  width: 20px;
  height: 20px;
  fill: none;
  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}
nav button.on {
  color: var(--acc);
}
nav button.on svg {
  stroke: var(--acc);
  filter: drop-shadow(0 2px 8px var(--acc-glow));
}

/* Charts */
.chartbox {
  margin-top: 14px;
  background: var(--card-inner);
  border: 1px solid var(--card-border);
  border-radius: 16px;
  padding: 12px;
}
.chartbox canvas {
  width: 100%;
  height: 280px;
  display: block;
  border-radius: 10px;
  background: #090d18;
}
.cbtn {
  background: var(--card-inner);
  border: 1px solid var(--card-border);
  color: var(--acc);
  padding: 6px 14px;
  border-radius: 8px;
  font-size: 12.5px;
  font-weight: 600;
  cursor: pointer;
  margin-top: 8px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

/* Form inputs */
input, select {
  width: 100%;
  background: var(--card-inner);
  color: var(--tx);
  border: 1px solid var(--card-border);
  border-radius: 12px;
  padding: 12px 14px;
  font-size: 15px;
  font-family: inherit;
  margin-top: 4px;
}
input:focus, select:focus {
  outline: none;
  border-color: var(--acc);
  box-shadow: 0 0 0 2px var(--acc-glow);
}
button.pri {
  width: 100%;
  background: linear-gradient(135deg, #38bdf8, #2563eb);
  color: #fff;
  border: 0;
  border-radius: 12px;
  padding: 13px;
  font-weight: 700;
  font-size: 15px;
  cursor: pointer;
  box-shadow: 0 4px 14px var(--acc-glow);
}

.row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  padding: 10px 0;
  border-bottom: 1px solid var(--line);
}
.row:last-child { border: 0; }
.warn {
  background: rgba(245, 158, 11, 0.12);
  border: 1px solid rgba(245, 158, 11, 0.3);
  color: #fbbf24;
  border-radius: 12px;
  padding: 10px 14px;
  margin: 10px 0;
  font-size: 13px;
}
.err {
  background: rgba(244, 63, 94, 0.12);
  border: 1px solid rgba(244, 63, 94, 0.3);
  color: #fda4af;
  border-radius: 12px;
  padding: 10px 14px;
  margin: 10px 0;
}
#toast {
  position: fixed;
  left: 16px;
  right: 16px;
  top: calc(env(safe-area-inset-top) + 12px);
  z-index: 999;
  display: none;
  background: #111a2e;
  border: 1px solid var(--acc);
  border-radius: 14px;
  padding: 12px 16px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  font-size: 13.5px;
}
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-logo">R</div>
    <div class="brand-info">
      <h1>Raj Trading World</h1>
      <span>AI Trade Terminal</span>
    </div>
  </div>
  <div class="header-actions">
    <span id="mode" class="badge"></span>
    <button class="btn-refresh" id="btnReload" title="Refresh data">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2"/></svg>
    </button>
  </div>
</header>

<div id="err"></div>
<div id="toast" role="alert"></div>
<main id="view"></main>

<nav id="nav">
  <button data-t="home" class="on">
    <svg viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
    Signals
  </button>
  <button data-t="markets">
    <svg viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
    Markets
  </button>
  <button data-t="search">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    Search
  </button>
  <button data-t="news">
    <svg viewBox="0 0 24 24"><path d="M19 20H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v1m2 13a2 2 0 0 1-2-2V7m2 13a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-2"/></svg>
    News
  </button>
  <button data-t="record">
    <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
    Record
  </button>
  <button data-t="settings">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    Settings
  </button>
</nav>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = x => {
  if (x == null) return "-";
  const a = Math.abs(x);
  return a >= 1000 ? Math.round(x).toLocaleString("en-IN") : a >= 10 ? x.toFixed(2) : x.toFixed(4);
};
const hm = iso => iso ? new Date(iso).toLocaleTimeString("en-IN", { hour: "2-digit", minute: "2-digit", hour12: true, timeZone: "Asia/Kolkata" }) : "-";

let tab = "home", mtab = "index", timer = null;

function key() { try { return localStorage.getItem("rtw_key") || ""; } catch(e) { return ""; } }
async function api(path, opt = {}) {
  const sep = path.includes("?") ? "&" : "?";
  const r = await fetch(path + (key() ? sep + "key=" + encodeURIComponent(key()) : ""), opt);
  if (r.status === 401) {
    const k = prompt("Password / Access key daalo");
    if (k) { try { localStorage.setItem("rtw_key", k); } catch(e){} return api(path, opt); }
    throw new Error("Access key chahiye");
  }
  if (!r.ok) {
    let m = r.statusText;
    try { m = (await r.json()).detail || m; } catch(e){}
    throw new Error(m);
  }
  return r.json();
}

function copyTrade(txt) {
  navigator.clipboard.writeText(txt).then(() => {
    showToast("✅ Trade Call Copied!", "Aap ab ise broker ya WhatsApp par paste kar sakte hain.");
  }).catch(() => {
    alert("Copied: " + txt);
  });
}

function moodStrip(d) {
  const it = (d.items || []).filter(x => x.headline);
  if (!it.length) return "";
  return `
    <div class="card mood-strip-card">
      <div class="mood-header">
        <span>Market ka Mahaul (Trend)</span>
        <span style="font-size:10.5px;text-transform:none;color:var(--tx-muted)">Live Sentiment</span>
      </div>
      <div class="mood-scroll">
        ${it.map(x => `
          <div class="mood-pill ${x.mood || ''}">
            <span>${x.mood ? (x.mood === 'BULLISH' ? '🟢' : x.mood === 'BEARISH' ? '🔴' : '🟡') : '⚪'}</span>
            <b>${esc(x.name)}</b>
            <span>${esc(x.label)}</span>
          </div>
        `).join("")}
      </div>
    </div>
  `;
}

let toastT = null;
function showToast(t, body) {
  const e = $("#toast");
  e.innerHTML = `<b style="display:block;margin-bottom:2px">${esc(t)}</b><span style="color:var(--tx-dim)">${esc(body || "")}</span>`;
  e.style.display = "block";
  clearTimeout(toastT);
  toastT = setTimeout(() => e.style.display = "none", 8000);
  e.onclick = () => e.style.display = "none";
}

async function pollMood() {
  try {
    const d = await api("/api/mood");
    let seen = null; try { seen = localStorage.getItem("rtw_mood_seen"); } catch(e){}
    const fl = d.flips || [];
    const last = fl.length ? fl[fl.length - 1].ts : "";
    if (seen === null) { try { localStorage.setItem("rtw_mood_seen", last); } catch(e){} return; }
    const fresh = fl.filter(f => f.ts > seen);
    if (fresh.length) {
      const nm = s => (d.items.find(i => i.symbol === s) || {}).name || s;
      const L = { BULLISH: "Tezi 🟢", BEARISH: "Mandi 🔴", SIDEWAYS: "Sideways 🟡" };
      showToast("Market Mood Update", fresh.map(f => `${nm(f.symbol)}: ${L[f.from]} → ${L[f.to]}`).join(" | "));
      try { localStorage.setItem("rtw_mood_seen", last); } catch(e){}
    }
  } catch(e){}
}

function srText(sr) {
  if (!sr) return "";
  const p = [];
  (sr.resistances || []).slice(0, 1).forEach(x => p.push("R: " + fmt(x.price) + " (" + x.touches + "t)"));
  (sr.supports || []).slice(0, 1).forEach(x => p.push("S: " + fmt(x.price) + " (" + x.touches + "t)"));
  (sr.zones || []).forEach(z => p.push((z.kind === "demand" ? "Demand " : "Supply ") + fmt(z.lo) + "–" + fmt(z.hi)));
  return p.length ? `<div style="font-size:12px;color:var(--tx-muted);margin:4px 0">${p.map(esc).join(" · ")}</div>` : "";
}

function drawChart(cv, d) {
  const dpr = window.devicePixelRatio || 1, W = cv.clientWidth, H = cv.clientHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  const g = cv.getContext("2d"); g.scale(dpr, dpr); g.clearRect(0, 0, W, H);
  const cs = d.candles || [];
  if (!cs.length) { g.fillStyle = "#8f9bb8"; g.fillText("Data nahi", 10, 20); return; }
  const PR = 58, PB = 18, pw = W - PR, ph = H - PB;
  let lo = Math.min(...cs.map(c => c.l)), hi = Math.max(...cs.map(c => c.h));
  (d.levels || []).forEach(l => { lo = Math.min(lo, l.price); hi = Math.max(hi, l.price); });
  const pad = (hi - lo) * 0.06 || 1; lo -= pad; hi += pad;
  const y = p => ph - (p - lo) / (hi - lo) * ph, step = pw / cs.length, bw = Math.max(1, step * 0.65);
  g.font = "10px system-ui"; g.lineWidth = 1;
  for (let i = 0; i <= 4; i++) {
    const p = lo + (hi - lo) * i / 4, yy = y(p);
    g.strokeStyle = "rgba(255,255,255,0.06)"; g.beginPath(); g.moveTo(0, yy); g.lineTo(pw, yy); g.stroke();
    g.fillStyle = "#64748b"; g.fillText(fmt(p), pw + 4, yy + 3);
  }
  cs.forEach((c, i) => {
    const x = i * step + step / 2, up = c.c >= c.o;
    g.strokeStyle = g.fillStyle = up ? "#10b981" : "#f43f5e";
    g.beginPath(); g.moveTo(x, y(c.h)); g.lineTo(x, y(c.l)); g.stroke();
    const t = y(Math.max(c.o, c.c)), b = y(Math.min(c.o, c.c));
    g.fillRect(x - bw / 2, t, bw, Math.max(1, b - t));
  });
  if (d.ema20) {
    g.strokeStyle = "#38bdf8"; g.lineWidth = 1.3; g.beginPath(); let st = false;
    d.ema20.forEach((e, i) => {
      if (e == null) return;
      const x = i * step + step / 2;
      if (!st) { g.moveTo(x, y(e)); st = true; } else g.lineTo(x, y(e));
    });
    g.stroke(); g.lineWidth = 1;
  }
  const sr = d.sr || {};
  (sr.zones || []).forEach(z => {
    const y1 = Math.max(0, Math.min(ph, y(z.hi))), y2 = Math.max(0, Math.min(ph, y(z.lo)));
    if (y2 - y1 < 1) return;
    g.fillStyle = z.kind === "demand" ? "rgba(16, 185, 129, 0.16)" : "rgba(244, 63, 94, 0.16)";
    g.fillRect(0, y1, pw, y2 - y1);
  });
  const col = { entry: "#38bdf8", sl: "#f43f5e", target: "#10b981" };
  let lastLab = -99;
  [...(d.levels || [])].sort((a, b) => y(a.price) - y(b.price)).forEach(l => {
    const yy = y(l.price);
    g.strokeStyle = col[l.kind] || "#f59e0b"; g.setLineDash([5, 4]);
    g.beginPath(); g.moveTo(0, yy); g.lineTo(pw, yy); g.stroke(); g.setLineDash([]);
    const ly = Math.max(yy - 3, lastLab + 11); lastLab = ly;
    g.fillStyle = col[l.kind] || "#f59e0b"; g.fillText((l.label ? l.label + " " : "") + fmt(l.price), 4, ly);
  });
  const last = cs[cs.length - 1];
  g.fillStyle = "#f1f5f9"; g.fillText(fmt(last.c), pw + 4, y(last.c) + 3);
}

async function loadChart(box, sym, tf, opt) {
  box.dataset.sym = sym; box.dataset.tf = tf; box.dataset.opt = opt ? JSON.stringify(opt) : "";
  box.innerHTML = `<div style="padding:14px;color:var(--tx-muted)">📈 Chart load ho raha hai...</div>`;
  let q = "/api/chart?q=" + encodeURIComponent(sym) + "&tf=" + tf;
  if (opt) q += `&strike=${opt.strike}&cp=${opt.cp}&expiry=${encodeURIComponent(opt.expiry)}`;
  try {
    const d = await api(q);
    if (!d.found) { box.innerHTML = `<div class="warn">${esc(d.message || "Chart nahi mila")}</div>`; return; }
    box.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <div class="chips" style="padding:0;margin:0">
          ${["5m", "15m", "1h"].map(t => `<button class="chip ${t === tf ? 'on' : ''}" data-tf="${t}">${t}</button>`).join("")}
        </div>
        <a href="${esc(d.tv_url)}" target="_blank" rel="noopener" style="color:var(--acc);font-size:12px;text-decoration:none;font-weight:600">TradingView ↗</a>
      </div>
      ${srText(d.sr)}
      <canvas></canvas>
    `;
    drawChart(box.querySelector("canvas"), d);
  } catch(e) {
    box.innerHTML = `<div class="err">${esc(e.message)}</div>`;
  }
}

document.addEventListener("click", e => {
  const b = e.target.closest("[data-chart],[data-ochart],[data-tf],[data-copy]");
  if (!b) return;
  if (b.dataset.copy) {
    copyTrade(b.dataset.copy);
    return;
  }
  if (b.dataset.tf) {
    const box = b.closest(".chartbox");
    loadChart(box, box.dataset.sym, b.dataset.tf, box.dataset.opt ? JSON.parse(box.dataset.opt) : null);
    return;
  }
  const card = b.closest(".card"), host = card || b.closest(".row") || b.parentElement;
  let box = card ? card.querySelector(".chartbox") : (host.nextElementSibling && host.nextElementSibling.classList.contains("chartbox") ? host.nextElementSibling : null);
  const opt = b.dataset.ochart ? JSON.parse(b.dataset.ochart) : null, sym = b.dataset.chart || b.dataset.sym;
  if (box && box.dataset.sym === sym && (box.dataset.opt || "") === (opt ? JSON.stringify(opt) : "")) {
    box.remove(); return;
  }
  if (box) box.remove();
  box = document.createElement("div"); box.className = "chartbox open";
  if (card) card.appendChild(box); else host.after(box);
  loadChart(box, sym, "5m", opt);
});

      ${(d.events || []).map(e => `
        <div class="row">
          <div>
            <b>${esc(e.name)}</b>
            <div style="font-size:11.5px;color:var(--tx-muted)">${(e.assets || []).join(", ")}</div>
          </div>
          <span style="font-size:12.5px;color:${e.impact === 'HIGH' ? 'var(--sell)' : 'var(--tx-dim)'};font-weight:600">${esc(e.when_text)}</span>
        </div>
      `).join("") || '<p style="color:var(--tx-muted)">Koi event nahi hai.</p>'}
    </div>

    <div class="card">
      <div style="font-size:12px;font-weight:700;color:var(--tx-muted);text-transform:uppercase;margin-bottom:8px">Top Market Headlines</div>
      ${(d.headlines || []).map(x => `
        <div class="row">
          <div style="font-size:13.5px;line-height:1.4">${esc(x.title)}</div>
        </div>
      `).join("") || '<p style="color:var(--tx-muted)">Abhi koi headline nahi.</p>'}
    </div>
  `;
  $("#view").innerHTML = h;
}

async function record() {
  const d = await api("/api/record"), a = d.all;
  let pts = "";
  if (d.equity.length > 1) {
    const ys = d.equity.map(e => e.cum_r), mn = Math.min(0, ...ys), mx = Math.max(0.1, ...ys);
    pts = d.equity.map((e, i) => `${(i / (d.equity.length - 1)) * 300},${88 - ((e.cum_r - mn) / (mx - mn)) * 80}`).join(" ");
  }

  let h = `
    <div class="card">
      <div style="font-size:12px;font-weight:700;color:var(--tx-muted);text-transform:uppercase;margin-bottom:8px">Track Record Stats</div>
      <div class="metrics-grid">
        <div class="metric-box"><span class="metric-label">Total Trades</span><span class="metric-val">${a.trades}</span></div>
        <div class="metric-box success"><span class="metric-label">Win Rate</span><span class="metric-val">${(a.win_rate * 100).toFixed(0)}%</span></div>
        <div class="metric-box accent"><span class="metric-label">Total R (P&L)</span><span class="metric-val">${a.total_r.toFixed(2)}R</span></div>
        <div class="metric-box"><span class="metric-label">Avg Return / Trade</span><span class="metric-val">${a.avg_r.toFixed(2)}R</span></div>
      </div>
      ${pts ? `<svg viewBox="0 0 300 90" preserveAspectRatio="none" style="width:100%;height:90px;margin-top:10px"><polyline fill="none" stroke="#38bdf8" stroke-width="2.5" points="${pts}"/></svg>` : '<p style="color:var(--tx-muted);font-size:13px;margin:8px 0 0">Equity curve ke liye kam se kam 2 trades chahiye.</p>'}
    </div>

    <div class="card">
      <div style="font-size:12px;font-weight:700;color:var(--tx-muted);text-transform:uppercase;margin-bottom:8px">Recent Past Trades</div>
      ${d.last.map(l => {
        const isWin = (l.r || 0) >= 0;
        return `
          <div class="row">
            <div>
              <b>${esc(l.symbol)}</b>
              <span class="badge ${l.direction === 'BUY' ? 'live' : 'paper'}" style="margin-left:4px">${esc(l.direction)}</span>
            </div>
            <span style="font-family:'JetBrains Mono';font-weight:700;color:${isWin ? 'var(--buy)' : 'var(--sell)'}">
              ${l.r != null ? (l.r > 0 ? '+' : '') + l.r.toFixed(2) + 'R' : esc(l.state)}
            </span>
          </div>
        `;
      }).join("") || '<p style="color:var(--tx-muted)">Abhi tak koi trade close nahi hua.</p>'}
    </div>
  `;
  $("#view").innerHTML = h;
}

async function settings() {
  const s = await api("/api/settings");
  $("#view").innerHTML = `
    <div class="card">
      <h3 style="margin:0 0 12px;font-size:16px">Trading Settings</h3>

      <div style="margin-bottom:12px">
        <label style="font-size:12px;color:var(--tx-muted);font-weight:600">Trading Capital (₹)</label>
        <input id="cap" type="number" value="${s.capital}">
      </div>

      <div style="margin-bottom:12px">
        <label style="font-size:12px;color:var(--tx-muted);font-weight:600">Risk Per Trade (%)</label>
        <input id="rp" type="number" step="0.1" value="${(s.risk_pct * 100).toFixed(1)}">
      </div>

      <div style="margin-bottom:12px">
        <label style="font-size:12px;color:var(--tx-muted);font-weight:600">Ek Saath Maximum Trades (1–5)</label>
        <select id="mt">
          ${[1, 2, 3, 4, 5].map(n => `<option ${n === s.max_trades ? "selected" : ""}>${n}</option>`).join("")}
        </select>
      </div>

      <div style="margin-bottom:16px">
        <label style="font-size:12px;color:var(--tx-muted);font-weight:600">Trading Profile</label>
        <select id="pf">
          ${["conservative", "moderate", "aggressive"].map(p => `<option ${p === s.profile ? "selected" : ""}>${p}</option>`).join("")}
        </select>
      </div>

      <button class="pri" id="sv">Settings Save Karein</button>
      <p id="msg" style="color:var(--buy);font-size:13px;margin:10px 0 0;text-align:center"></p>
    </div>
  `;

  $("#sv").onclick = async () => {
    try {
      await api("/api/settings", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({
          capital: +$("#cap").value,
          risk_pct: +$("#rp").value / 100,
          profile: $("#pf").value,
          max_trades: +$("#mt").value
        })
      });
      $("#msg").textContent = "✅ Settings successfully save ho gayi!";
      setTimeout(() => $("#msg").textContent = "", 3000);
    } catch(e) {
      $("#msg").textContent = "❌ " + e.message;
    }
  };
}

const views = { home, markets, search, news, record, settings };

async function render() {
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.t === tab));
  $("#err").innerHTML = "";
  try {
    await views[tab]();
  } catch(e) {
    $("#err").innerHTML = `<div class="err">${esc(e.message)}</div>`;
  }
}

document.querySelectorAll("nav button").forEach(b => b.onclick = () => { tab = b.dataset.t; render(); });
$("#btnReload").onclick = () => { render(); showToast("Refreshing...", "Taza data load ho raha hai"); };

pollMood();
setInterval(() => { if (document.visibilityState === "visible") pollMood(); }, 30000);
render();
timer = setInterval(() => {
  if (["home", "markets", "news"].includes(tab) && document.visibilityState === "visible" && !document.querySelector(".chartbox")) {
    render();
  }
}, 30000);

if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});
</script>
</body>
</html>
